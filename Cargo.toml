[package]
name = "buf_redux_ng"
version = "0.8.6"
authors = [
    "Austin Bonander <austin.bonander@gmail.com>",
    "Carlo Deutschmann <deutschmanncarlo@gmail.com>",
]
edition = "2015"
description = "Maintained drop-in fork of `buf_redux` 0.8.4: std::io::BufReader/BufWriter/LineWriter replacements with direct buffer access and customizable buffering policies. Fixes the trailing_semicolon_in_macro future-incompatibility warning."
documentation = "https://docs.rs/buf_redux_ng"
readme = "README.md"
keywords = ["io", "buffer", "bufreader", "bufwriter", "buf_redux"]
categories = ["data-structures"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/CarloTUM/buf_redux_ng"

[dependencies.memchr]
version = "2.0"

[features]
default = ["slice-deque"]
nightly = ["slice-deque/unstable"]

[target."cfg(any(unix, windows))".dependencies.slice-deque]
version = "0.2"
optional = true
