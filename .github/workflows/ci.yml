name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # weekly, to catch breakage from new Rust releases
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: ["default", "--no-default-features"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        shell: bash
        run: |
          if [ "${{ matrix.features }}" = "default" ]; then
            cargo test
          else
            cargo test ${{ matrix.features }}
          fi

  future-incompat:
    name: no future-incompatibility warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and check report
        run: |
          # deny the lint in this crate, and fail on future-incompat reports from dependencies
          RUSTFLAGS="-D semicolon_in_expressions_from_macros" cargo build --all-targets 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -q "will be rejected by a future version of Rust" build.log; then
            cargo report future-incompatibilities
            exit 1
          fi
